<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads — Darien Entwistle</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    .dl-filters { display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1.25rem; align-items:center; }
    .dl-filters label { color:var(--text-muted); font-size:0.9rem; }
    .dl-filters select {
      background: var(--card); color: var(--text); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 0.45rem 0.75rem; font-size: 0.9rem;
    }
    .dl-item {
      background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 1.15rem 1.25rem; margin-bottom: 0.85rem;
    }
    .dl-item strong { color: var(--red-soft); }
    .dl-item a { color: var(--sand); text-decoration: none; font-weight: 600; }
    .dl-item a:hover { text-decoration: underline; }
    .dl-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">dent<span>wistle</span>.online</a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="music.html">Music</a></li>
        <li><a href="downloads.html" class="active">Downloads</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="socialmedia.html">Social</a></li>
        <li><a href="https://ev-expert-chat-701502515049.us-west1.run.app" target="_blank" rel="noopener" class="external">EVy</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Down<span>loads</span></h1>
    <p class="text-center lead mb-2">Scripts, games, and theme packs.</p>

    <div class="card">
      <div class="dl-filters">
        <label for="category">Category</label>
        <select id="category" onchange="filterDownloads()">
          <option value="">All</option>
          <option value="script">Scripts</option>
          <option value="game">Games</option>
          <option value="theme-pack">Theme Packs</option>
        </select>
        <label for="sort">Sort</label>
        <select id="sort" onchange="sortDownloads()">
          <option value="date">Date</option>
          <option value="file-type">File Type</option>
        </select>
      </div>
      <div id="downloadsList"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="music.html">Music</a>
        <a href="downloads.html">Downloads</a>
        <a href="blog.html">Blog</a>
      </div>
      <div class="footer-socials">
        <a href="https://www.twitch.tv/khaos_demon" title="Twitch" target="_blank" rel="noopener">🎮</a>
        <a href="https://www.youtube.com/computerwiz/" title="YouTube" target="_blank" rel="noopener">📺</a>
        <a href="https://soundcloud.com/djdarien" title="SoundCloud" target="_blank" rel="noopener">🎵</a>
        <a href="https://github.com/djdarien" title="GitHub" target="_blank" rel="noopener">💻</a>
      </div>
      <div class="footer-copy">&copy; 2026 Darien Entwistle · <a href="https://dentwistle.online">dentwistle.online</a></div>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    if (toggle && links) toggle.addEventListener('click', () => links.classList.toggle('open'));

    const downloads = [
      { name: 'Pop OS Bulk App Installer', path: '/popapps_installer.sh', description: 'Bulk install Spotify, Discord, Steam, Blender and more on a fresh Pop OS install.', category: 'script', fileType: 'sh', date: '2022-06-01' },
      { name: 'UE Installer', path: '/files/ue_installer.sh', description: 'Install Unreal Engine on Debian-based distros.', category: 'script', fileType: 'sh', date: '2022-02-15' },
      { name: 'Cyber Security Toolset (macOS)', path: '/files/cyber_securitytoolset_macos.sh', description: 'Installs Homebrew + popular cybersecurity tools on macOS.', category: 'script', fileType: 'sh', date: '2024-08-05' },
      { name: 'Adventures of Ollie The Ball', path: 'https://s3.amazonaws.com/netbytegames/ollietheball/Adventures+of+Ollie+The+Ball-The+Lost+Coin+Hunt(Alpha053).msi', description: 'Platformer inspired by Rolie Polie Olie.', category: 'game', fileType: 'msi', date: '2021-12-20' },
      { name: 'Windows Legacy Theme Pack', path: 'https://github.com/djdarien/mycustomwindows10themes/releases/download/1.0/Windows.Legacy.deskthemepack', description: 'Classic Windows look theme pack.', category: 'theme-pack', fileType: 'deskthemepack', date: '2021-05-25' },
      { name: 'Jurassic Park Theme Pack', path: 'https://github.com/djdarien/mycustomwindows10themes/releases/download/1/JurassicPark-Ingen.zip', description: 'Jurassic Park / InGen inspired theme.', category: 'theme-pack', fileType: 'zip', date: '2021-08-10' }
    ];

    function filterDownloads() {
      displayDownloads(document.getElementById('category').value, document.getElementById('sort').value);
    }
    function sortDownloads() {
      displayDownloads(document.getElementById('category').value, document.getElementById('sort').value);
    }
    function displayDownloads(category = '', sortBy = 'date') {
      let list = [...downloads];
      if (category) list = list.filter(d => d.category === category);
      if (sortBy === 'file-type') list.sort((a, b) => a.fileType.localeCompare(b.fileType));
      else list.sort((a, b) => new Date(b.date) - new Date(a.date));

      const el = document.getElementById('downloadsList');
      el.innerHTML = list.map(d => `
        <div class="dl-item">
          <strong>${d.name}</strong><br>
          <a href="${d.path}" target="_blank" rel="noopener">${d.path.split('/').pop() || d.name}</a>
          <p style="margin:0.4rem 0 0;color:var(--text-muted);font-size:0.9rem;">${d.description}</p>
          <div class="dl-meta">${d.fileType.toUpperCase()} · ${d.date}</div>
        </div>`).join('');
    }
    displayDownloads();
  </script>
</body>
</html>
